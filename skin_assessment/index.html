<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 皮肤评估 · Braden 压疮风险</title>
    <style>
        /* ===== 全局重置 & 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px 100px;
        }

        .app {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 32px 32px 24px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            padding: 24px 20px 20px;
            position: relative;
        }

        /* ===== 顶部标题 & 实时总分 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
        }

        .score-badge {
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 18px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .score-badge span {
            color: #3b82f6;
            min-width: 28px;
            text-align: center;
        }

        /* ===== 进度提示 ===== */
        .progress-hint {
            font-size: 13px;
            color: #94a3b8;
            text-align: right;
            margin-bottom: 16px;
        }

        /* ===== 维度卡片 ===== */
        .dimension {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px 16px 12px;
            margin-bottom: 16px;
            border: 1px solid #e9edf2;
            transition: border-color 0.2s;
        }

        .dimension.has-value {
            border-color: #b9d0f0;
            background: #f0f6ff;
        }

        .dimension-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .dimension-name {
            font-weight: 600;
            font-size: 16px;
            color: #0f172a;
        }

        .dimension-score {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            background: white;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid #d1d9e6;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 8px;
        }

        .option-btn {
            background: white;
            border: 1.5px solid #dbe0e8;
            border-radius: 40px;
            padding: 8px 4px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1.3;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            user-select: none;
        }

        .option-btn:active {
            transform: scale(0.96);
        }

        .option-btn.selected {
            background: #1e293b;
            border-color: #1e293b;
            color: white;
            box-shadow: 0 4px 8px rgba(30, 41, 59, 0.15);
        }

        /* 摩擦维度特殊（只有3个选项） */
        .dimension-friction .options {
            grid-template-columns: repeat(3, 1fr);
        }

        /* ===== 底部操作栏 ===== */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 14px 20px 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e9edf2;
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .footer .total-label {
            font-size: 15px;
            color: #475569;
        }

        .footer .total-value {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 4px;
        }

        .footer .total-value.danger {
            color: #dc2626;
        }
        .footer .total-value.warning {
            color: #f59e0b;
        }
        .footer .total-value.success {
            color: #16a34a;
        }
        .footer .total-value.info {
            color: #3b82f6;
        }

        .btn-generate {
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.25);
            white-space: nowrap;
        }

        .btn-generate:active {
            transform: scale(0.96);
            box-shadow: 0 2px 6px rgba(30, 41, 59, 0.2);
        }

        .btn-generate:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* ===== 风险等级色块 ===== */
        .risk-tag {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: white;
            margin-left: 6px;
        }

        /* ===== 模态框（报告） ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal {
            background: white;
            max-width: 440px;
            width: 100%;
            border-radius: 32px;
            padding: 32px 24px 28px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            line-height: 1;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 8px;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #0f172a;
        }

        .report-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .report-sub {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .report-score {
            text-align: center;
            padding: 20px 0 16px;
            border-radius: 24px;
            background: #f8fafc;
            margin-bottom: 24px;
        }

        .report-score .big-number {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
        }

        .report-score .level-text {
            font-size: 20px;
            font-weight: 600;
            margin-top: 6px;
        }

        .report-score .level-desc {
            font-size: 14px;
            color: #475569;
            margin-top: 6px;
            padding: 0 16px;
        }

        .report-dimensions {
            margin-bottom: 24px;
        }

        .report-dimensions h3 {
            font-size: 16px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 12px;
        }

        .dimension-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .dimension-bar .label {
            width: 72px;
            font-size: 13px;
            color: #334155;
            font-weight: 500;
            flex-shrink: 0;
        }

        .dimension-bar .track {
            flex: 1;
            height: 8px;
            background: #e9edf2;
            border-radius: 40px;
            overflow: hidden;
        }

        .dimension-bar .fill {
            height: 100%;
            border-radius: 40px;
            background: #3b82f6;
            transition: width 0.3s;
        }

        .dimension-bar .value {
            width: 24px;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
        }

        .report-suggest {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 16px 18px;
            margin-top: 12px;
        }

        .report-suggest h4 {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .report-suggest ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .report-suggest li {
            font-size: 14px;
            color: #1e293b;
            padding: 4px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }

        .report-suggest li:last-child {
            border-bottom: none;
        }

        .report-suggest li .icon {
            flex-shrink: 0;
        }

        .btn-close-report {
            display: block;
            width: 100%;
            margin-top: 20px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close-report:active {
            background: #0f172a;
        }

        /* ===== 工具类 ===== */
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .hidden {
            display: none;
        }

        /* 响应式调整 */
        @media (max-width: 420px) {
            .app {
                padding: 16px 14px 12px;
            }
            .options {
                grid-template-columns: repeat(2, 1fr);
            }
            .dimension-friction .options {
                grid-template-columns: repeat(3, 1fr);
            }
            .option-btn {
                font-size: 12px;
                padding: 6px 2px;
                min-height: 36px;
            }
            .footer .total-value {
                font-size: 22px;
            }
            .btn-generate {
                padding: 10px 20px;
                font-size: 14px;
            }
            .report-score .big-number {
                font-size: 44px;
            }
        }

        @media (min-width: 600px) {
            .options {
                grid-template-columns: repeat(4, 1fr);
            }
            .dimension-friction .options {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- 头部 -->
        <div class="header">
            <h1>🩺 皮肤评估 <small>Braden</small></h1>
            <div class="score-badge">
                ⭐ <span id="totalScoreDisplay">0</span> 分
            </div>
        </div>

        <!-- 进度提示 -->
        <div class="progress-hint" id="progressHint">请完成所有维度评估</div>

        <!-- ===== 维度列表 ===== -->
        <div id="dimensionsContainer">
            <!-- 由 JS 动态生成 -->
        </div>

        <!-- 底部固定栏 (实际fixed，但这里作为占位，实际固定到视口) -->
    </div>

    <!-- 底部操作栏（fixed） -->
    <div class="footer">
        <div>
            <span class="total-label">总分</span>
            <span class="total-value" id="footerTotal">0</span>
        </div>
        <button class="btn-generate" id="btnGenerate" disabled>📊 生成评估报告</button>
    </div>

    <!-- ===== 报告模态框 ===== -->
    <div class="modal-overlay" id="reportModal">
        <div class="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="report-title">📋 AI 风险评估报告</div>
            <div class="report-sub">Braden 压疮风险预测量表 · 自动生成</div>

            <div class="report-score" id="reportScoreCard">
                <div class="big-number" id="reportTotal">0</div>
                <div class="level-text" id="reportLevel">—</div>
                <div class="level-desc" id="reportDesc">请完成评估</div>
            </div>

            <div class="report-dimensions">
                <h3>📊 各维度得分</h3>
                <div id="reportBars"></div>
            </div>

            <div class="report-suggest" id="reportSuggest">
                <h4>💡 智能护理建议</h4>
                <ul id="suggestList">
                    <li>完成评估后自动生成</li>
                </ul>
            </div>

            <button class="btn-close-report" id="btnCloseReport">关闭报告</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  1. 数据定义
        // ================================================================
        const dimensions = [{
            id: 'sensation',
            label: '感觉（感知能力）',
            options: ['完全受限', '非常受限', '轻度受限', '未受损害'],
            scores: [1, 2, 3, 4]
        }, {
            id: 'moisture',
            label: '潮湿',
            options: ['持续潮湿', '非常潮湿', '有时潮湿', '很少潮湿'],
            scores: [1, 2, 3, 4]
        }, {
            id: 'activity',
            label: '活动力',
            options: ['限制卧床', '坐位', '偶尔步行', '经常行走'],
            scores: [1, 2, 3, 4]
        }, {
            id: 'mobility',
            label: '移动力',
            options: ['完全不能', '严重受限', '轻度受限', '不受限'],
            scores: [1, 2, 3, 4]
        }, {
            id: 'nutrition',
            label: '营养',
            options: ['非常差', '可能缺乏', '充足', '丰富'],
            scores: [1, 2, 3, 4]
        }, {
            id: 'friction',
            label: '摩擦和剪切力',
            options: ['有问题', '有潜在问题', '无明显问题'],
            scores: [1, 2, 3]
        }];

        // ================================================================
        //  2. 状态管理
        // ================================================================
        const state = {
            scores: { sensation: null, moisture: null, activity: null, mobility: null, nutrition: null, friction: null },
            get total() {
                const vals = Object.values(this.scores);
                if (vals.some(v => v === null)) return null;
                return vals.reduce((a, b) => a + b, 0);
            },
            get allSelected() {
                return Object.values(this.scores).every(v => v !== null);
            }
        };

        // ================================================================
        //  3. DOM 引用
        // ================================================================
        const container = document.getElementById('dimensionsContainer');
        const totalScoreDisplay = document.getElementById('totalScoreDisplay');
        const footerTotal = document.getElementById('footerTotal');
        const progressHint = document.getElementById('progressHint');
        const btnGenerate = document.getElementById('btnGenerate');
        const reportModal = document.getElementById('reportModal');
        const modalClose = document.getElementById('modalClose');
        const btnCloseReport = document.getElementById('btnCloseReport');

        const reportTotal = document.getElementById('reportTotal');
        const reportLevel = document.getElementById('reportLevel');
        const reportDesc = document.getElementById('reportDesc');
        const reportBars = document.getElementById('reportBars');
        const suggestList = document.getElementById('suggestList');
        const reportScoreCard = document.getElementById('reportScoreCard');

        // ================================================================
        //  4. 渲染维度
        // ================================================================
        function renderDimensions() {
            container.innerHTML = '';
            dimensions.forEach((dim, index) => {
                const isFriction = dim.id === 'friction';
                const div = document.createElement('div');
                div.className = `dimension ${isFriction ? 'dimension-friction' : ''}`;
                div.dataset.dimId = dim.id;

                // header
                const header = document.createElement('div');
                header.className = 'dimension-header';
                header.innerHTML = `
                    <span class="dimension-name">${index+1}. ${dim.label}</span>
                    <span class="dimension-score" id="scoreLabel_${dim.id}">0 分</span>
                `;
                div.appendChild(header);

                // options
                const optContainer = document.createElement('div');
                optContainer.className = 'options';
                dim.options.forEach((label, idx) => {
                    const val = dim.scores[idx];
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = label;
                    btn.dataset.value = val;
                    btn.dataset.dimId = dim.id;
                    btn.addEventListener('click', () => handleOptionClick(dim.id, val, btn));
                    optContainer.appendChild(btn);
                });
                div.appendChild(optContainer);
                container.appendChild(div);
            });
        }

        // ================================================================
        //  5. 交互逻辑
        // ================================================================
        function handleOptionClick(dimId, value, btn) {
            // 取消同组其他选中
            const parent = btn.closest('.options');
            parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));

            // 选中当前
            btn.classList.add('selected');

            // 更新状态
            state.scores[dimId] = value;

            // 更新维度分数显示
            const scoreLabel = document.getElementById(`scoreLabel_${dimId}`);
            if (scoreLabel) scoreLabel.textContent = value + ' 分';

            // 高亮维度卡片
            const dimCard = btn.closest('.dimension');
            if (dimCard) dimCard.classList.add('has-value');

            // 更新总分
            updateTotalUI();

            // 启用/禁用按钮
            btnGenerate.disabled = !state.allSelected;

            // 进度提示
            if (state.allSelected) {
                progressHint.textContent = '✅ 所有维度已完成，可生成报告';
                progressHint.style.color = '#16a34a';
            } else {
                const selected = Object.values(state.scores).filter(v => v !== null).length;
                progressHint.textContent = `已完成 ${selected} / ${dimensions.length} 个维度`;
                progressHint.style.color = '#94a3b8';
            }
        }

        function updateTotalUI() {
            const total = state.total;
            const display = total !== null ? total : 0;
            totalScoreDisplay.textContent = display;
            footerTotal.textContent = display;

            // 颜色
            const el = footerTotal;
            if (total === null) {
                el.className = 'total-value';
                return;
            }
            let cls = 'total-value';
            if (total <= 9) cls += ' danger';
            else if (total <= 12) cls += ' warning';
            else if (total <= 18) cls += ' success';
            else cls += ' info';
            el.className = cls;
        }

        // ================================================================
        //  6. 风险判定 & 报告生成
        // ================================================================
        function getRiskLevel(total) {
            if (total <= 9) return { level: '极度高危', color: '#dc2626', desc: '患者发生压疮风险极高，需立即采取全面预防措施。' };
            if (total <= 12) return { level: '高度危险', color: '#f59e0b', desc: '风险很高，必须加强翻身频次并使用减压敷料。' };
            if (total <= 14) return { level: '中度危险', color: '#f97316', desc: '存在中等风险，需制定标准化的皮肤护理计划。' };
            if (total <= 18) return { level: '轻度危险', color: '#22c55e', desc: '存在轻度风险，继续保持常规预防性护理。' };
            return { level: '无危险', color: '#3b82f6', desc: '皮肤状态良好，维持日常观察即可。' };
        }

        function generateSuggestions(scores) {
            const tips = [];
            const map = {
                sensation: '感觉受限',
                moisture: '潮湿问题',
                activity: '活动力不足',
                mobility: '移动力受限',
                nutrition: '营养缺乏',
                friction: '摩擦剪切力风险'
            };
            for (const [key, val] of Object.entries(scores)) {
                if (val === null) continue;
                if (val <= 2) {
                    let advice = '';
                    switch (key) {
                        case 'sensation':
                            advice = '评估疼痛感知，使用减压床垫，定时翻身（Q2H）。';
                            break;
                        case 'moisture':
                            advice = '加强皮肤清洁，使用吸收性敷料，保持床单元干燥。';
                            break;
                        case 'activity':
                            advice = '协助床上活动，使用翻身辅助工具，避免长时间卧床。';
                            break;
                        case 'mobility':
                            advice = '进行被动关节活动，鼓励主动运动，必要时使用康复设备。';
                            break;
                        case 'nutrition':
                            advice = '咨询营养师，增加蛋白质和热量摄入，考虑肠内营养支持。';
                            break;
                        case 'friction':
                            advice = '使用无滑动移位单，床头抬高≤30°，避免拖拽摩擦。';
                            break;
                    }
                    tips.push({ dimension: map[key] || key, advice });
                }
            }
            if (tips.length === 0) {
                tips.push({ dimension: '整体', advice: '当前各维度评分良好，继续维持现有护理措施，每日皮肤监测。' });
            }
            return tips;
        }

        function generateReport() {
            if (!state.allSelected) return;
            const total = state.total;
            const risk = getRiskLevel(total);
            const scores = { ...state.scores };

            // 填充报告
            reportTotal.textContent = total;
            reportLevel.textContent = risk.level;
            reportLevel.style.color = risk.color;
            reportDesc.textContent = risk.desc;
            // 卡片背景浅色
            reportScoreCard.style.borderLeft = `6px solid ${risk.color}`;

            // 维度条形图
            let barsHtml = '';
            dimensions.forEach(dim => {
                const val = scores[dim.id];
                const pct = (val / 4) * 100; // 最大值4（摩擦最大3，但显示按比例）
                const barColor = val <= 2 ? '#f97316' : '#3b82f6';
                barsHtml += `
                    <div class="dimension-bar">
                        <span class="label">${dim.label}</span>
                        <div class="track">
                            <div class="fill" style="width: ${Math.min(pct, 100)}%; background: ${barColor};"></div>
                        </div>
                        <span class="value">${val}</span>
                    </div>
                `;
            });
            reportBars.innerHTML = barsHtml;

            // 建议
            const tips = generateSuggestions(scores);
            let listHtml = '';
            tips.forEach(t => {
                listHtml += `<li><span class="icon">🩺</span> <strong>${t.dimension}：</strong>${t.advice}</li>`;
            });
            suggestList.innerHTML = listHtml;

            // 显示模态框
            reportModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ================================================================
        //  7. 事件绑定
        // ================================================================
        btnGenerate.addEventListener('click', generateReport);

        function closeModal() {
            reportModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        btnCloseReport.addEventListener('click', closeModal);
        reportModal.addEventListener('click', (e) => {
            if (e.target === reportModal) closeModal();
        });

        // ================================================================
        //  8. 初始化
        // ================================================================
        renderDimensions();
        updateTotalUI();
        progressHint.textContent = `已完成 0 / ${dimensions.length} 个维度`;

        // 可选：预填示例（方便演示，可注释掉）
        // 例如预填一组典型值：高度危险案例
        // 但为了教学，保持空白，让学生自主选择。
        // 我们可以加一个“快速示例”按钮，但暂不添加保持简洁。
    </script>

</body>
